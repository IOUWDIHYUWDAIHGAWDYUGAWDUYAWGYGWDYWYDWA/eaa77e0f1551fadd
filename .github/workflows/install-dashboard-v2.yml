name: Install dashboard v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-dashboard-v2.yml]
permissions:
  contents: write
concurrency:
  group: install-dashboard-v2
  cancel-in-progress: true
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified dashboard package
        shell: bash
        run: |
          cat .vybot/dashboard.part* | base64 -d > /tmp/dashboard-v2.tar.xz
          tar -xJf /tmp/dashboard-v2.tar.xz
          rm -f /tmp/dashboard-v2.tar.xz
      - name: Commit production dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch .vybot .github/workflows/install-dashboard-v2.yml
          git add dashboard/index.html assets/css/dashboard-v2.css assets/js/dashboard-v2.js bridge/cloudflare-management.cjs
          git diff --cached --quiet && exit 0
          git commit -m "Launch integrated Discord management dashboard"
          git push origin HEAD:main
