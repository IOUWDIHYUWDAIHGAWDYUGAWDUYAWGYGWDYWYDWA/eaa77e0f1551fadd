name: Cleanup temporary encrypted bundle files

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-temporary-bundle-files.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary transfer files and workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          rm -rf .bundle-transfer .bundle-rotation
          rm -f .bot-restart
          rm -f .github/workflows/rotate-bundle-key.yml
          rm -f .github/workflows/restart-bundle-rotation.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No temporary files remain.'
            exit 0
          fi
          git commit -m '[skip ci] Remove temporary encrypted bundle files'
          git push origin main
