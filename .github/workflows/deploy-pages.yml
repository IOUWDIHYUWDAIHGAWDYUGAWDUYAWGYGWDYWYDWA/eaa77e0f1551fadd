name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'yeniwebsite/**'
      - 'dashboard/**'
      - 'assets/css/dashboard-v2.css'
      - 'assets/js/dashboard-v2.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          rm -rf site
          cp -a yeniwebsite site
          mkdir -p site/dashboard site/assets/css site/assets/js
          cp dashboard/index.html site/dashboard/index.html
          cp assets/css/dashboard-v2.css site/assets/css/dashboard-v2.css
          cp assets/js/dashboard-v2.js site/assets/js/dashboard-v2.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4