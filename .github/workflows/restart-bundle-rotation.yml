name: Restart secure bundle rotation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-bundle-rotation.yml'

permissions:
  contents: write
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start fresh key recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rotate-bundle-key.yml --ref main
      - name: Remove restart helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restart-bundle-rotation.yml
          git commit -m 'Remove one-time bundle rotation restart helper'
          git push origin HEAD:main
