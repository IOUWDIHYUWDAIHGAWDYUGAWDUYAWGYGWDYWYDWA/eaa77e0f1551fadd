name: vybot 24/7 GitHub Actions Host

on:
  schedule:
    - cron: '0 */5 * * *' # Her 5 saatte bir otomatik yenilenir
  workflow_dispatch:      # Manuel başlatma butonu
  push:
    branches: [ main ]

permissions: write-all

concurrency:
  group: vybot-host
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🌐 Cloudflare WARP Kur ve Bağlan (Datacenter IP Engelini Kaldır)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 3
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp || true

      - name: ⚡ Bağımlılık & yt-dlp Önbelleği (Cache)
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            /usr/local/bin/yt-dlp
          key: tools-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 🎵 yt-dlp Kur (Gerekirse)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          sudo curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 📦 Bağımlılıkları Yükle (npm ci)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔓 Şifreli Kodları Çöz (Decrypt Bundle)
        env:
          DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
        run: |
          if [ -z "$DECRYPTION_KEY" ]; then
            echo "❌ HATA: GitHub Secrets içerisine 'DECRYPTION_KEY' eklenmemiş!"
            exit 1
          fi
          node decrypt.js "$DECRYPTION_KEY"

      - name: 🚀 Komutları Discord API'ye Güncelle (Deploy)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/deploy-commands.js

      - name: 🤖 Botu Çalıştır (5 Saatlik Döngü)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GH_PERSONAL_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_SETTINGS_RAW_URL: https://raw.githubusercontent.com/IOUWDIHYUWDAIHGAWDYUGAWDUYAWGYGWDYWYDWA/eaa77e0f1551fadd/main/guild-settings.json
        run: |
          echo "========================================================"
          echo "⚡ vybot başlatılıyor..."
          echo "⏰ Bu oturum 4 saat 55 dakika boyunca kesintisiz çalışacak."
          echo "🔄 Süre dolduğunda kendini otomatik yenileyip sıradaki Actions'ı başlatacak."
          echo "========================================================"
          # 4 saat 55 dakika = 17700 saniye sonra temiz sonlanma
          timeout 17700 node src/index.js || true
          echo "Oturum süresi tamamlandı, yenileniyor..."

      - name: 🔄 Sıradaki 5 Saatlik Döngüyü Başlat (Auto-Relay)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Yeni 5 saatlik Actions döngüsü tetikleniyor..."
          gh workflow run main.yml || true
