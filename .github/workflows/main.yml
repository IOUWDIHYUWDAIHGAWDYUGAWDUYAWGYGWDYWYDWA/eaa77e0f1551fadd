name: vybot 24/7 GitHub Actions Host

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: vybot-host
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 📥 Kodu Çek
        uses: actions/checkout@v4
      - name: 🟢 Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Bağımlılık önbelleği
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            /usr/local/bin/yt-dlp
          key: tools-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 🎵 yt-dlp Kur
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          sudo curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
      - name: 📦 Bağımlılıkları yükle ve doğrula
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sql.js@1.13.0
          node -e "require.resolve('sql.js'); console.log('sql.js hazır')"
      - name: 🔓 Şifreli kodları çöz
        id: decrypt
        continue-on-error: true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$DISCORD_TOKEN"
          DECRYPTION_KEY="$(node scripts/unwrap-bundle-key.js)"
          test -n "$DECRYPTION_KEY"
          export DECRYPTION_KEY
          node decrypt.js
          unset DECRYPTION_KEY
          test -f src/deploy-commands.js
          test -f src/index.js
          node --check bridge/cloudflare-management.cjs
      - name: 🚀 Tam bot komutlarını güncelle
        id: deploy
        if: steps.decrypt.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: '1536835757132751048'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          node src/deploy-commands.js > /tmp/deploy-commands.log 2>&1
          status=$?
          cat /tmp/deploy-commands.log
          failure_class=success
          if [ "$status" -ne 0 ]; then
            if grep -q 'Missing Access' /tmp/deploy-commands.log; then
              failure_class=missing_access
            elif grep -q 'Cannot find module' /tmp/deploy-commands.log; then
              failure_class=missing_module
            elif grep -q 'Bot token bulunamadı' /tmp/deploy-commands.log; then
              failure_class=missing_token
            else
              failure_class=deploy_failed
            fi
          fi
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: 🩺 Başlangıç aşamasını güvenle kaydet
        if: always()
        env:
          DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          FAILURE_CLASS: ${{ steps.deploy.outputs.failure_class }}
        run: |
          python3 - <<'PY'
          import json, os, time
          status = {
            'workflowCommit': os.environ.get('GITHUB_SHA', ''),
            'decrypt': os.environ.get('DECRYPT_OUTCOME', 'unknown'),
            'deployCommands': os.environ.get('DEPLOY_OUTCOME', 'unknown'),
            'failureClass': os.environ.get('FAILURE_CLASS') or 'none',
            'targetGuild': '1536835757132751048',
            'recordedAt': int(time.time())
          }
          with open('.runtime-status.json', 'w', encoding='utf-8') as f:
            json.dump(status, f, ensure_ascii=False, indent=2)
            f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .runtime-status.json
          git commit -m '[skip ci] Record encrypted bot startup stage' || exit 0
          git push origin HEAD:main
      - name: 🤖 Tam bot ve güvenli panel bağlantısı
        if: steps.decrypt.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: '1536835757132751048'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Tam bot, Cloudflare paneline kısa ömürlü Actions kimliğiyle bağlanıyor."
          env -u VYBOT_API_PORT timeout 17700 node --require ./bridge/cloudflare-management.cjs src/index.js || true
      - name: 🛟 Güvenli panel yönetim modu
        if: steps.decrypt.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          echo "Şifreli paket açılamadı; kaynak yayınlanmadan panel yönetim modu başlatılıyor."
          timeout 17700 node bridge/management-only.cjs || true
      - name: 🔄 Sıradaki döngüyü başlat
        if: steps.decrypt.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml || true
