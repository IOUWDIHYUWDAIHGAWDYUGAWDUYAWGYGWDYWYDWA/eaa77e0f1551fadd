name: VYBot Production
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  id-token: write
concurrency:
  group: vybot-host
  cancel-in-progress: true
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Kaynağı doğrula ve şifrele
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if [ -f src/index.js ]; then
            npm run check
            cp -a src /tmp/vybot-src
            npm run encrypt
            git rm -r src
            git rm -f bundle.key.enc 2>/dev/null || true
            git add bundle.enc
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m '[skip ci] Encrypt VYBot 2 source' || true
            git push || true
            cp -a /tmp/vybot-src src
          else
            npm run decrypt
            npm run check
          fi
      - name: 34 slash komutunu kaydet
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: '1536835757132751048'
        run: npm run deploy
      - name: Görsel botu ve web köprüsünü başlat
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: '1536835757132751048'
        run: |
          set +e
          timeout 17700 node --require ./bridge/cloudflare-management.cjs src/index.js
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
      - name: Sonraki döngü
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml || true
