name: vybot 24/7 GitHub Actions Host

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: vybot-host
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 📥 Kodu Çek
        uses: actions/checkout@v4
      - name: 🟢 Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 🌐 Mevcut WARP bağlantısını hazırla
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect || true
          sleep 3
      - name: ⚡ Bağımlılık önbelleği
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            /usr/local/bin/yt-dlp
          key: tools-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 🎵 yt-dlp Kur
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          sudo curl -L -s https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
      - name: 📦 Bağımlılıkları yükle
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: 🔓 Şifreli kodları çöz
        id: decrypt
        continue-on-error: true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$DISCORD_TOKEN"
          DECRYPTION_KEY="$(node scripts/unwrap-bundle-key.js)"
          test -n "$DECRYPTION_KEY"
          export DECRYPTION_KEY
          node decrypt.js
          unset DECRYPTION_KEY
          test -f src/deploy-commands.js
          test -f src/index.js
          node --check bridge/cloudflare-management.cjs
      - name: 🚀 Tam bot komutlarını güncelle
        if: steps.decrypt.outcome == 'success'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/deploy-commands.js
      - name: 🤖 Tam bot ve güvenli panel bağlantısı
        if: steps.decrypt.outcome == 'success'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Tam bot, Cloudflare paneline kısa ömürlü Actions kimliğiyle bağlanıyor."
          env -u VYBOT_API_PORT timeout 17700 node --require ./bridge/cloudflare-management.cjs src/index.js || true
      - name: 🛟 Güvenli panel yönetim modu
        if: steps.decrypt.outcome == 'failure'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          echo "Şifreli paket açılamadı; kaynak yayınlanmadan panel yönetim modu başlatılıyor."
          timeout 17700 node bridge/management-only.cjs || true
      - name: 🔄 Sıradaki döngüyü başlat
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml || true
